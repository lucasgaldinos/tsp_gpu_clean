[project]
name = "gpu-accelerated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.30.1",
    "ipympl>=0.9.7",
    "jupyterlab>=4.4.7",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.11.6",
    "marimo>=0.16.1",
    "matplotlib>=3.10.6",
    "nbformat>=5.10.4",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pymupdf4llm>=0.0.27",
    "ruff>=0.13.1",
    "routing-data",
    "ipywidgets>=8.1.7",
    "pillow>=11.3.0",
    "plotly>=6.3.1",
    "jupyter>=1.1.1",
    "duckdb>=1.4.1",
    "pytest>=8.4.2",
    "cupy-cuda12x>=13.6.0",
    "mypy>=1.18.2",
    "tabulate>=0.9.0",
    "scipy>=1.15.3",
    "scikit-posthocs>=0.11.4",
    "pandoc-mermaid-filter>=0.1.0",
]

[tool.uv.workspace]
members = [
    "data/Routing_data/vrp_database",
]

[tool.uv.sources]
routing-data = { git = "https://github.com/lucasgaldinos/Routing_data.git", rev = "main" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["code"]
