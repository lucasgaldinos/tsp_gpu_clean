# ==============================================================================
# Global Ruff Configuration
# ==============================================================================

# Target the minimum Python version your project supports
target-version = "py312"


# Files or directories to ignore entirely
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "dist",
  "build",
]

# ==============================================================================
# Linting Configuration
# ==============================================================================
[lint]
# Rules to enable by default
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort (import sorting)
  "B",   # flake8-bugbear (common bugs/design issues)
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade (modernize syntax)
  "ARG", # flake8-unused-arguments
  "PT",  # flake8-pytest-style
  "RUF", # Ruff-specific rules
]

# Rules to explicitly ignore
ignore = [
  "E501", # Line too long (handled gracefully by the formatter)
]

# Allow fixable rules to be automatically corrected
fixable = ["ALL"]
unfixable = []

# Configure rule-specific behaviors
[lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ["src"] # Change to your root package name

[lint.flake8-pytest-style]
fixture-parentheses = false

# ==============================================================================
# Formatter Configuration
# ==============================================================================
[format]
# Use spaces instead of tabs
indent-style = "space"

# Prefer double quotes over single quotes
quote-style = "double"

# Control magic trailing commas behavior
skip-magic-trailing-comma = false

# Wrap lines in docstrings or comments when they exceed line-length
docstring-code-format = true
